name: Enterprise Gateway Service

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  deploy-gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Gateway Server Validation & Health Check
        run: |
          python3 backend/unified_node.py &
          sleep 5
          curl -I http://localhost:8080/health
          echo "Gateway operational check passed successfully."
